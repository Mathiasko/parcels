<!doctype html>
<!-- Served by app/protocol.ts after a failed move in. Static: the main process fills the double-brace
     placeholders, each HTML-escaped (the stylesheet excepted), and no script runs here. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not moved in - Parcels</title>
<style>{{style}}
/* The brand without a link: there is no dashboard to go to yet. */
nav .brand{font-weight:600;padding:.25rem 0}
p .mono{white-space:normal;overflow-wrap:anywhere}
.notice{display:block}
.notice p+p{margin-top:.25rem}
.acts{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.acts button{height:2.25rem}
</style></head>
<body><div class="frame">
<header><nav aria-label="Main"><span class="brand">Parcels</span></nav></header>
<main><div class="col">
<h1>Your parcels were not moved</h1>
<p class="lede">Nothing was moved, and <span class="mono">{{clone}}</span> is as it was.</p>
<div class="notice warn" role="alert"><p><strong>{{step}} did not work.</strong></p><p>{{reason}}</p></div>
<p>You can try again, or quit and go on using the old install.</p>
<form method="post" action="parcels://move-in/">
<p class="acts"><button class="pri" name="action" value="move">Try again</button><button name="action" value="quit">Quit</button></p>
</form>
</div></main></div></body></html>
