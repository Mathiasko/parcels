<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Parcels' app icon: the Postal mood board's `appicon` (a stamp on a blue tile, with a postmark)
       on the macOS icon grid. The board draws it full-bleed on a 64-unit tile; here that tile is
       824 px square with a 185 px corner, centred on the 1024 canvas (a 100 px margin), with a soft
       shadow below it inside the margin. Fixed colours: the icon does not follow the theme.
       16 and 32 px use app-icon-small.svg instead. scripts/app/make-app-icon.mjs renders both. -->
  <defs>
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <filter id="stamp-shadow" x="-10%" y="-10%" width="125%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx=".2" dy=".55" stdDeviation=".45" flood-color="#0b1a3a" flood-opacity=".45"/>
    </filter>
    <!-- The board's m-icon: half-circle bites along the stamp's four edges. -->
    <mask id="m-icon" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <g fill="#000">
        <circle cx="12" cy="13" r="1.8"/><circle cx="12" cy="19" r="1.8"/><circle cx="12" cy="25" r="1.8"/><circle cx="12" cy="31" r="1.8"/><circle cx="12" cy="37" r="1.8"/><circle cx="12" cy="43" r="1.8"/><circle cx="12" cy="49" r="1.8"/><circle cx="12" cy="55" r="1.8"/>
        <circle cx="52" cy="13" r="1.8"/><circle cx="52" cy="19" r="1.8"/><circle cx="52" cy="25" r="1.8"/><circle cx="52" cy="31" r="1.8"/><circle cx="52" cy="37" r="1.8"/><circle cx="52" cy="43" r="1.8"/><circle cx="52" cy="49" r="1.8"/><circle cx="52" cy="55" r="1.8"/>
        <circle cx="17" cy="10" r="1.8"/><circle cx="22" cy="10" r="1.8"/><circle cx="27" cy="10" r="1.8"/><circle cx="32" cy="10" r="1.8"/><circle cx="37" cy="10" r="1.8"/><circle cx="42" cy="10" r="1.8"/><circle cx="47" cy="10" r="1.8"/>
        <circle cx="17" cy="56" r="1.8"/><circle cx="22" cy="56" r="1.8"/><circle cx="27" cy="56" r="1.8"/><circle cx="32" cy="56" r="1.8"/><circle cx="37" cy="56" r="1.8"/><circle cx="42" cy="56" r="1.8"/><circle cx="47" cy="56" r="1.8"/>
      </g>
    </mask>
  </defs>

  <!-- The tile, with its shadow. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#23468c" filter="url(#tile-shadow)"/>

  <!-- The board's 64-unit drawing, scaled onto the tile (824 / 64 = 12.875). -->
  <g transform="translate(100 100) scale(12.875)">
    <g transform="rotate(-6 32 32)">
      <g filter="url(#stamp-shadow)">
        <rect x="12" y="10" width="40" height="46" fill="#fbf6ea" mask="url(#m-icon)"/>
      </g>
      <rect x="17" y="15" width="30" height="36" fill="#f6c21c"/>
      <path d="M22 28h20v16H22z" fill="#c78a3c"/>
      <path d="M22 28l4-6h12l4 6z" fill="#e0a95a"/>
      <path d="M31 22v22" stroke="#1d2433" stroke-width="2"/>
      <path d="M22 34h20" stroke="#1d2433" stroke-width="1.5" opacity=".5"/>
    </g>
    <!-- The postmark: a red ring and a wave. -->
    <g fill="none" stroke="#b3261e" stroke-width="2.4" stroke-linecap="round" opacity=".9">
      <circle cx="46" cy="44" r="9"/>
      <path d="M38 52q4-3 8 0t8 0"/>
    </g>
  </g>
</svg>
